<title>Poultry Farm Manager · पोल्ट्री फार्म मैनेजर</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1f2a24;--mut:#6b756f;--line:#e3e1d8;--brand:#2f6b3f;--brand2:#e8f1ea;
--s1:#b7791f;--s2:#2b6cb0;--s3:#2f855a;--s4:#6b46c1;--bad:#c53030;--ok:#2f855a;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#161a17;--card:#1f2521;--ink:#e8ece9;--mut:#9aa6a0;--line:#2e3631;--brand:#5fb577;--brand2:#233229;
--s1:#e0a73c;--s2:#6aa6e8;--s3:#5fb577;--s4:#a58cf0;--bad:#f2766f;--ok:#5fb577;--warn:#e0a73c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}
.pill{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--brand);color:#fff}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav{width:210px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:10px 8px}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px}
nav button:hover{background:var(--brand2)}nav button.on{background:var(--brand);color:#fff}
nav .sep{font-size:11px;color:var(--mut);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
main{flex:1;min-width:0;padding:16px;max-width:1400px}
@media(max-width:800px){.layout{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;gap:4px}
nav button{white-space:nowrap;width:auto;margin:0}nav .sep{display:none}main{padding:12px}}
h2{margin:0 0 4px;font-size:19px}h3{margin:18px 0 8px;font-size:15px}
.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--brand)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}.btn.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--line)}
.kpi b{display:block;font-size:21px;margin-top:2px}.kpi span{color:var(--mut);font-size:12px}
.kpi.s1{border-top-color:var(--s1)}.kpi.s2{border-top-color:var(--s2)}.kpi.s3{border-top-color:var(--s3)}.kpi.s4{border-top-color:var(--s4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--brand2);font-weight:600;font-size:12px;position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.muted{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid currentColor}
.alert{padding:8px 12px;border-left:4px solid var(--warn);background:var(--card);border-radius:6px;margin-bottom:6px;border:1px solid var(--line);border-left-width:4px}
.alert.bad{border-left-color:var(--bad)}.alert.ok{border-left-color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
#modal.on{display:flex}.dlg{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:520px;border:1px solid var(--line)}
.dlg h3{margin:0 0 10px}.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.fld .hint{font-size:11.5px;color:var(--mut);margin-top:2px}
.err{color:var(--bad);margin:6px 0;min-height:18px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;z-index:30}
.login{max-width:340px;margin:60px auto}.hb{display:flex;align-items:center;gap:6px;margin:3px 0}
.hb i{display:block;height:14px;border-radius:3px;min-width:2px}.hb span{font-size:12px;white-space:nowrap}
#wm{position:fixed;right:12px;bottom:8px;font-size:11px;letter-spacing:.03em;color:var(--mut);opacity:.75;pointer-events:none;z-index:4;background:var(--bg);padding:1px 8px;border-radius:99px}
#wm b{color:var(--brand)}
@media print{header,nav,.bar,.btn{display:none!important}}
</style>

function invStats(v,id,loc,ex={}){
  const c=INV[v],q=c.q,st=D[c.stock].filter(x=>x.item_id===id&&(loc==null||x.location===loc)&&x.id!==ex.stock),buy=st.filter(x=>x.kind!=='wastage'),waste=sum(st.filter(x=>x.kind==='wastage'),x=>x[q]);
  const ep=D.expenses.filter(e=>e[c.expf]===id&&(loc==null||e.location===loc)&&e.id!==ex.exp);
  const lg=c.logs?D.daily_logs.filter(l=>l.feed_item_id===id&&(loc==null||l.location===loc)&&l.id!==ex.log):[];
  const tr=loc==null?[]:D.store_transfers.filter(x=>x.inv===v&&x.item_id===id&&x.id!==ex.tr),ti=tr.filter(x=>x.to_location===loc),to=tr.filter(x=>x.from_location===loc);
  const inn=sum(buy,x=>x[q]),tin=sum(ti,x=>x.qty),tout=sum(to,x=>x.qty),used=sum(ep,e=>e.qty)+sum(lg,l=>l.feed_kg),bal=inn+tin-tout-waste-used;
  const cin=inn+tin,cc=sum(buy,x=>x.total_cost)+sum(ti,x=>num(x.qty)*num(x.rate)),avg=cin?cc/cin:0;
  return{inn,tin,tout,waste,used,usedCost:sum(ep,e=>e.amount)+sum(lg,l=>l.feed_cost),bal,avg,value:Math.max(0,bal)*avg,active:inn>0||tin>0||tout>0||used>0||waste>0};
}
function invAvgCostAt(v,id,loc,date){
  const c=INV[v],q=c.q,sel=(strict)=>[D[c.stock].filter(x=>x.item_id===id&&x.location===loc&&x.kind!=='wastage'&&(!strict||x.date<=date)),D.store_transfers.filter(x=>x.inv===v&&x.item_id===id&&x.to_location===loc&&(!strict||x.date<=date))];
  let [b,ti]=sel(true);if(!b.length&&!ti.length)[b,ti]=sel(false);
  if(!b.length&&!ti.length)b=D[c.stock].filter(x=>x.item_id===id&&x.kind!=='wastage');
  const qq=sum(b,x=>x[q])+sum(ti,x=>x.qty);return qq?(sum(b,x=>x.total_cost)+sum(ti,x=>num(x.qty)*num(x.rate)))/qq:0;
}

// ---- Location (every entry): 1 Tekuatad, 2 Siswa. Stage 1 & 2 default Tekuatad, stage 3 & 4 default Siswa ----
const LOCS=['Tekuatad','Siswa'];
const LOCDEFAULT={cages:'Tekuatad',egg_production:'Tekuatad',egg_transfers:'Tekuatad',hatch_batches:'Tekuatad',chick_sales:'Tekuatad',reserve_lots:'Tekuatad',reserve_moves:'Tekuatad',

const locByStage=st=>(+st===1||+st===2)?'Tekuatad':'Siswa';
const locFor=(k,row)=>(k==='mortality'||k==='expenses')?locByStage(row&&row.stage||1):(LOCDEFAULT[k]||'Siswa');
Object.keys(ENT).concat([]).forEach(k=>{const E=ENT[k];if(k==='feed_items'||k==='med_items'||NOLOC.includes(k))return;
 E.fields.splice(Math.min(1,E.fields.length),0,{k:'location',l:'Location',t:'select',opts:LOCS.map(x=>[x,x]),req:1,def:()=>locFor(k)});
 if(E.cols.indexOf('location')<0)E.cols.splice(Math.min(1,E.cols.length),0,'location')});
const CASC={cages:[['egg_production','cage_id'],['egg_transfers','cage_id'],['reserve_moves','cage_id']],feed_items:[['feed_stock','item_id']],med_items:[['med_stock','item_id']],sup_items:[['sup_stock','item_id']],hatch_batches:[['egg_transfers','batch_id'],['chick_sales','batch_id']],flocks:[['weights','flock_id'],['market_sales','flock_id'],['daily_logs','flock_id'],['flock_transfers','from_flock_id'],['flock_transfers','to_flock_id']]};
const POLY={cages:[1],hatch_batches:[2],flocks:[3,4]};

/* ---------- calculations ---------- */
const expOf=(st,id)=>sum(D.expenses.filter(e=>e.stage===st&&e.ref_id===id),e=>e.amount);
const mortOf=(st,id)=>sum(D.mortality.filter(m=>m.stage===st&&m.ref_id===id),m=>m.qty)+(st===3?sum(D.daily_logs.filter(l=>l.flock_id===id),l=>l.mortality):0);
const mortSex=(st,id)=>{const r=D.mortality.filter(m=>m.stage===st&&m.ref_id===id);let a=[sum(r,m=>m.qty_m),sum(r,m=>m.qty_f)];if(st===3){const l=D.daily_logs.filter(x=>x.flock_id===id);a=[a[0]+sum(l,x=>x.mortality_m),a[1]+sum(l,x=>x.mortality_f)]}return a};
/* mortality = ad-hoc records + mortality typed in the daily sheet (marked _daily) */
const allMort=()=>[...D.mortality,...D.daily_logs.filter(l=>num(l.mortality)>0).map(l=>({id:l.id,_daily:1,stage:3,ref_id:l.flock_id,date:l.date,qty:l.mortality,qty_m:l.mortality_m,qty_f:l.mortality_f,cause:l.cause,notes:l.medicine?'Medicine: '+l.medicine:''}))];
function liveAt(f,d){ // live birds in a flock at end of date d
  if(d<f.placed_on)return 0;
  return num(f.chicks_placed)+sum(D.flock_transfers.filter(x=>x.to_flock_id===f.id&&x.date<=d),x=>x.qty)-sum(D.flock_transfers.filter(x=>x.from_flock_id===f.id&&x.date<=d),x=>x.qty)
   -sum(D.market_sales.filter(s=>s.flock_id===f.id&&s.date<=d),s=>s.birds)-sum(allMort().filter(m=>m.stage===3&&m.ref_id===f.id&&m.date<=d),m=>m.qty);
}
function cageStats(c){
  const eggs=D.egg_production.filter(e=>e.cage_id===c.id),mort=mortOf(1,c.id),tp=D.reserve_moves.filter(x=>x.kind==='topup'&&x.cage_id===c.id),top=sum(tp,x=>x.qty),topM=sum(tp,x=>x.qty_m),topF=sum(tp,x=>x.qty_f),live=num(c.initial_birds)+top-mort;
  const total=sum(eggs,e=>e.eggs_total),broken=sum(eggs,e=>e.eggs_broken),sent=sum(D.egg_transfers.filter(x=>x.cage_id===c.id),x=>x.eggs);
  const from=addDays(today(),-6),w=sum(eggs.filter(e=>e.date>=from),e=>e.eggs_total);
  const ms_=mortSex(1,c.id);return{mort,live,liveM:num(c.initial_m)+topM-ms_[0],liveF:num(c.initial_f)+topF-ms_[1],top,topM,topF,total,broken,sent,stock:total-broken-sent,lay:live>0?w/(live*7)*100:0,exp:expOf(1,c.id)};
}
/* Reserve parent birds: pool that tops up Stage-1 cages after mortality */
function reserveStats(exId,lotId){ // lotId undefined = all lots; a lot id = that lot; null = older entries that have no lot
  const sel=x=>lotId===undefined||(lotId?x.lot_id===lotId:!x.lot_id),r=D.reserve_moves.filter(x=>x.id!==exId&&sel(x)),o={};
  const lots=D.reserve_lots.filter(l=>lotId===undefined||l.id===lotId);
  for(const k of ['in','topup','mortality','out']){const g=r.filter(x=>x.kind===k);o[k]=sum(g,x=>x.qty);o[k+'M']=sum(g,x=>x.qty_m);o[k+'F']=sum(g,x=>x.qty_f)}
  o.init=sum(lots,l=>l.initial_birds);o.initM=sum(lots,l=>l.initial_m);o.initF=sum(lots,l=>l.initial_f);
  o.in+=o.init;o.inM+=o.initM;o.inF+=o.initF;
  o.bal=o.in-o.topup-o.mortality-o.out;o.balM=o.inM-o.topupM-o.mortalityM-o.outM;o.balF=o.inF-o.topupF-o.mortalityF-o.outF;
  o.value=lotId===undefined?sum(D.reserve_lots,l=>Math.max(0,reserveStats(null,l.id).bal)*num(l.cost_per_bird)):(lots[0]?Math.max(0,o.bal)*num(lots[0].cost_per_bird):0);
  return o;
}
function batchStats(b){

function fieldHTML(f,vals){
  const id='f_'+f.k,v=vals[f.k]??'';let inp;
  if(f.t==='select'){const o=typeof f.opts==='function'?f.opts(vals):f.opts;
    inp=`<select id="${id}" data-k="${f.k}">${f.blank?`<option value="">${t(f.blank)}</option>`:''}${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${f.tr?t(b):esc(b)}</option>`).join('')}</select>`}
  else if(f.t==='textarea')inp=`<textarea id="${id}" data-k="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" data-k="${f.k}" type="${f.t}" ${f.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}">`;
  return `<div class="fld"><label for="${id}">${t(f.l)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function readForm(E){
  const v={};
  E.fields.filter(f=>!f.nf).forEach(f=>{
    const el=$('#f_'+f.k);if(!el)return;let x=el.value;
    if(f.t==='number')x=x===''?null:Number(x);else if(f.num)x=x===''?null:Number(x);else if(x==='')x=null;
    v[f.k]=x;
  });return v;
}
function openForm(name,row,preset){
  const E=ENT[name],vals={};
  E.fields.filter(f=>!f.nf).forEach(f=>vals[f.k]=typeof f.def==='function'?f.def():(f.def??''));
  Object.assign(vals,row||{},preset||{});
  // sensible auto-fill: pick the first available option for required selects with no value
  E.fields.filter(f=>f.t==='select'&&f.req&&(vals[f.k]===''||vals[f.k]==null)).forEach(f=>{const o=typeof f.opts==='function'?f.opts(vals):f.opts;if(o.length)vals[f.k]=o[0][0]});

async function resolveCustomer(v){ // existing customer chosen -> use it; otherwise add / match the typed customer in the master
  const nm=String(v.customer||'').trim(),ph=String(v.customer_phone||'').trim(),ad=String(v.customer_address||'').trim();delete v.customer_phone;delete v.customer_address;
  if(v.customer_id){const c=byId('customers',v.customer_id);if(c)v.customer=c.name;return}
  if(!nm){v.customer=null;v.customer_id=null;return}
  let c=D.customers.find(x=>x.name.trim().toLowerCase()===nm.toLowerCase()&&(!ph||!x.phone||String(x.phone)===ph));
  if(!c)c=await DB.insert('customers',{name:nm,phone:ph||null,address:ad||null});
  else{const up={};if(ph&&!c.phone)up.phone=ph;if(ad&&!c.address)up.address=ad;if(Object.keys(up).length)await DB.update('customers',c.id,up)}
  v.customer_id=c.id;v.customer=c.name;
}
async function saveForm(){
  const {name,row}=S.form,E=ENT[name],v=readForm(E),err=m=>{$('#err').textContent=m};const sexErr=applySex(name,v);
  for(const f of E.fields){if(f.req&&!f.nf&&(v[f.k]==null||v[f.k]===''))return err(`${f.l} is required`)}
  if(sexErr)return err(sexErr);
  if(name==='mortality'&&v.ref_id==null)return err('Choose where the mortality happened');
  if(E.validate){const m=E.validate(v,row);if(m)return err(m)}
  if(SEXV[name]){const m=SEXV[name](v,row);if(m)return err(m)}
  if(E.before)E.before(v,row);
  try{if(E.fields.some(f=>f.k==='customer_id'))await resolveCustomer(v);}catch(e){return err(e.message||String(e))}
  try{row?await DB.update(name,row.id,v):await DB.insert(name,v)}catch(e){return err(e.message||String(e))}
  closeModal();toast('✓ '+t('Save'));render();
}
async function delRecord(name,id){
  const r=byId(name,id);if(!r)return;
  if(name==='feed_items'&&(D.daily_logs.some(l=>l.feed_item_id===id)||D.expenses.some(x=>x.feed_item_id===id)))return alert('This food has usage records (daily entries / expenses). Remove or change those first.');
  if(['feed_items','med_items','sup_items'].includes(name)&&D.store_transfers.some(x=>x.item_id===id))return alert('This item has location transfers. Delete those transfers first.');
  if(name==='sup_items'&&D.expenses.some(x=>x.sup_item_id===id))return alert('This item has been used in expenses. Remove or change those expenses first.');
  if(name==='customers'&&custSales(byId('customers',id)).length)return alert('This customer has sales recorded. Sales keep the customer name; delete or reassign the sales first.');
  if(name==='labourers'&&D.labour_wages.some(x=>x.labourer_id===id))return alert('This labourer has wage entries. Set Status = Left instead of deleting, or delete the wage entries first.');
  if(name==='med_items'&&D.expenses.some(x=>x.med_item_id===id))return alert('This medicine has been used in expenses. Remove or change those expenses first.');
  if(name==='reserve_lots'&&D.reserve_moves.some(x=>x.lot_id===id))return alert('This lot has top-up / mortality entries. Remove those first.');
  if(name==='hatch_batches'&&D.flocks.some(f=>f.batch_id===id))return alert('This batch has flocks moved to grow-out. Delete or reassign those flocks first.');
  if(!confirm('Delete this record'+(CASC[name]?' and everything linked to it':'')+'?'))return;
  try{
    for(const [tb,col] of (CASC[name]||[]))for(const x of D[tb].filter(x=>x[col]===id))await DB.remove(tb,x.id);
    for(const st of (POLY[name]||[])){for(const x of D.mortality.filter(x=>x.stage===st&&x.ref_id===id))await DB.remove('mortality',x.id);for(const x of D.expenses.filter(x=>x.stage===st&&x.ref_id===id))await DB.remove('expenses',x.id)}
    await DB.remove(name,id);
  }catch(e){return alert(e.message)}
  if(S.detail&&S.detail.id===id)S.detail=null;render();
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.a,{e,id,k}=b.dataset;
  if(a==='nav'){if(['ov','feed','med','sup'].includes(k)){S.page='store';S.storeTab=k}else S.page=k;S.detail=null;render()}
  else if(a==='lang'){LANG=k;LS('pfm_lang',k);render()}
  else if(a==='add'){openForm(e,null,b.dataset.p?JSON.parse(b.dataset.p):null)}
  else if(a==='edit'){openForm(e,byId(e,id))}
  else if(a==='del'){await delRecord(e,id)}
  else if(a==='detail'){S.detail={e,id};render()}
  else if(a==='back'){S.detail=null;render()}
  else if(a==='bs'){S.bsFlock=id;S.page='bs';S.detail=null;render()}
  else if(a==='close'){closeModal()}
  else if(a==='save'){await saveForm()}
  else if(a==='seed'){await seed()}
  else if(a==='wipe'){if(confirm('Erase ALL demo data in this browser?')){TABLES.forEach(t=>D[t]=[]);DB.persist();render()}}
  else if(a==='csv'){exportCSV(k)}
  else if(a==='backup'){download('poultry-backup-'+today()+'.json',JSON.stringify(D,null,1),'application/json')}
  else if(a==='allPresent'){document.querySelectorAll('.att-sel').forEach(x=>{if(!x.value)x.value='Present'})}
  else if(a==='saveAtt'){const sd=S.labDate||today(),sl=S.labSheetLoc||LOCS[0];let n=0;
    for(const tr of document.querySelectorAll('tr[data-lab]')){const lid=tr.dataset.lab,at=tr.querySelector('.att-sel').value,rate=num(tr.querySelector('.att-rate').value),extra=num(tr.querySelector('.att-extra').value);
      const ex=D.labour_wages.find(x=>x.labourer_id===lid&&x.date===sd&&x.location===sl);if(!at)continue;
      const days=ATT[at],row={date:sd,location:sl,labourer_id:lid,attendance:at,days,rate,extra,amount:Math.round((days*rate+extra)*100)/100};
      ex?await DB.update('labour_wages',ex.id,row):await DB.insert('labour_wages',row);n++}
    toast('✓ '+n+' '+t('saved'));render()}
  else if(a==='logout'){DB.clearCache();await DB.sb.auth.signOut();location.reload()}
});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset.a;
  if(a==='filter'){S[el.dataset.k]=el.value;render();return}
  if(a==='rf'){S[el.dataset.k]=el.value;render();return}
  if(a==='cfg'){cfg[el.dataset.k]=el.dataset.t?el.value:(Number(el.value)||0);LS('pfm_cfg',JSON.stringify(cfg));toast('✓ '+t('Save'));return}
  if(S.form&&el.closest('#modal')){const E=ENT[S.form.name];
    {const f=E.fields.find(f=>f.k===el.dataset.k&&f.redraw);if(f){S.form.vals={...S.form.vals,...readForm(E)};if(f.onChange)f.onChange(S.form.vals);drawModal();return}}
    if(E.fields.some(f=>f.dep===el.dataset.k)){S.form.vals={...S.form.vals,...readForm(E)};
      E.fields.filter(f=>f.dep===el.dataset.k).forEach(f=>{S.form.vals[f.k]=''});
      const f0=E.fields.filter(f=>f.dep===el.dataset.k)[0];const o=f0.opts(S.form.vals);S.form.vals[f0.k]=f0.blank?'':(o[0]?o[0][0]:'');
      if(el.dataset.k==='stage'&&E.fields.some(f=>f.k==='location'))S.form.vals.location=locByStage(S.form.vals.stage);drawModal()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.form)closeModal()});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:type+';charset=utf-8'}));a.download=name;a.click()}
function exportCSV(k){
  const rows=D[k];if(!rows.length)return toast('No records');const keys=Object.keys(rows[0]).filter(x=>x!=='created_at');
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  download(k+'-'+today()+'.csv',[keys.join(','),...rows.map(r=>keys.map(x=>q(r[x])).join(','))].join('\n'),'text/csv');
}

/* ---------- boot ---------- */
function loginView(msg){
  app.innerHTML=`<div class="login card"><h2>🐔 Poultry Farm Manager</h2><p class="sub">पोल्ट्री फार्म मैनेजर</p><div class="fld"><label>${t('Email')}</label><input id="em" type="email" autocomplete="username"></div><div class="fld"><label>${t('Password')}</label><input id="pw" type="password" autocomplete="current-password"></div><div class="err" id="lerr">${esc(msg||'')}</div>
  <div class="row"><button class="btn pri" id="go">${t('Sign in')}</button></div></div>`;
  const go=async()=>{const b=$('#go');if(b.disabled)return;b.disabled=true;b.textContent=t('Signing in')+'…';$('#lerr').textContent='';
    try{const{data,error}=await DB.sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
      if(error)throw error;DB.uid=data.session.user.id;await startApp()}
    catch(e){b.disabled=false;b.textContent=t('Sign in');$('#lerr').textContent=e.message||String(e)}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#em').onkeydown=e=>{if(e.key==='Enter')$('#pw').focus()};$('#em').focus();
}
const loadingView=()=>{app.innerHTML=`<div class="login card"><h2>🐔 Poultry Farm Manager</h2><p class="sub">Loading your farm data… / डेटा लोड हो रहा है…</p></div>`};
async function startApp(){
  if(DB.mode==='cloud'&&DB.loadCache()){render();DB.refresh();return}    // instant: show saved data, refresh in background
  loadingView();await DB.loadAll();render();
}
const domReady=new Promise(r=>document.readyState==='loading'?document.addEventListener('DOMContentLoaded',r):r());
async function boot(){
  try{await domReady;await DB.init();if(!(await DB.session()))return loginView();await startApp()}
  catch(e){app.innerHTML=`<div class="login card"><h2>Connection problem</h2><p class="err">${esc(e.message||e)}</p><button class="btn" onclick="location.reload()">Retry</button></div>`}
}
window.addEventListener('beforeunload',e=>{if(DB.pend){e.preventDefault();e.returnValue=''}});
boot();
</script>
