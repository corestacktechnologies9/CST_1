<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poultry Farm Manager · पोल्ट्री फार्म मैनेजर</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1f2a24;--mut:#6b756f;--line:#e3e1d8;--brand:#2f6b3f;--brand2:#e8f1ea;
--s1:#b7791f;--s2:#2b6cb0;--s3:#2f855a;--s4:#6b46c1;--bad:#c53030;--ok:#2f855a;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#161a17;--card:#1f2521;--ink:#e8ece9;--mut:#9aa6a0;--line:#2e3631;--brand:#5fb577;--brand2:#233229;
--s1:#e0a73c;--s2:#6aa6e8;--s3:#5fb577;--s4:#a58cf0;--bad:#f2766f;--ok:#5fb577;--warn:#e0a73c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}
.pill{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--brand);color:#fff}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav{width:210px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:10px 8px}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px}
nav button:hover{background:var(--brand2)}nav button.on{background:var(--brand);color:#fff}
nav .sep{font-size:11px;color:var(--mut);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
main{flex:1;min-width:0;padding:16px;max-width:1400px}
@media(max-width:800px){.layout{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;gap:4px}
nav button{white-space:nowrap;width:auto;margin:0}nav .sep{display:none}main{padding:12px}}
h2{margin:0 0 4px;font-size:19px}h3{margin:18px 0 8px;font-size:15px}
.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--brand)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}.btn.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--line)}
.kpi b{display:block;font-size:21px;margin-top:2px}.kpi span{color:var(--mut);font-size:12px}
.kpi.s1{border-top-color:var(--s1)}.kpi.s2{border-top-color:var(--s2)}.kpi.s3{border-top-color:var(--s3)}.kpi.s4{border-top-color:var(--s4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--brand2);font-weight:600;font-size:12px;position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.muted{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid currentColor}
.alert{padding:8px 12px;border-left:4px solid var(--warn);background:var(--card);border-radius:6px;margin-bottom:6px;border:1px solid var(--line);border-left-width:4px}
.alert.bad{border-left-color:var(--bad)}.alert.ok{border-left-color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
#modal.on{display:flex}.dlg{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:520px;border:1px solid var(--line)}
.dlg h3{margin:0 0 10px}.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.fld .hint{font-size:11.5px;color:var(--mut);margin-top:2px}
.err{color:var(--bad);margin:6px 0;min-height:18px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;z-index:30}
.login{max-width:340px;margin:60px auto}.hb{display:flex;align-items:center;gap:6px;margin:3px 0}
.hb i{display:block;height:14px;border-radius:3px;min-width:2px}.hb span{font-size:12px;white-space:nowrap}
@media print{header,nav,.bar,.btn{display:none!important}}
</style>
</head>

const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};

const $=(s,r=document)=>r.querySelector(s);
let D={}; // all data, loaded in memory

'Recent chick sales':'हाल की चूजा बिक्री','Recent weights':'हाल के वज़न','Recent sales':'हाल की बिक्री','All stages':'सभी चरण','From':'से','To':'तक','Export CSV':'CSV निकालें','Language':'भाषा','Demo mode (data stays in this browser)':'डेमो मोड (डेटा इसी ब्राउज़र में)','Cloud (Supabase)':'क्लाउड (Supabase)',
'Load sample data':'नमूना डेटा लोड करें','Erase demo data':'डेमो डेटा मिटाएं','Backup (JSON)':'बैकअप (JSON)','Sign in':'लॉग इन','Sign out':'लॉग आउट','Email':'ईमेल','Password':'पासवर्ड','No records':'कोई रिकॉर्ड नहीं','Storage':'भंडारण','Incubating':'इन्क्यूबेशन','Hatch due now':'हैच देय','Hatched':'हैच हो गया',
'Stage summary':'चरण सारांश','Flock profit & loss':'झुंड लाभ-हानि','Hatch report':'हैच रिपोर्ट','Parent cage report':'पैरेंट पिंजरा रिपोर्ट','Cost per bird':'लागत प्रति पक्षी','Chick cost':'चूजे की लागत','Other costs':'अन्य लागत','Ready for market':'बाज़ार के लिए तैयार','Flock placed':'झुंड डाला',
'Disease':'बीमारी','Heat stress':'गर्मी','Cold stress':'ठंड','Injury / Crush':'चोट / कुचलना','Predator':'शिकारी जानवर','Culled':'छांटा गया','Unknown':'अज्ञात','Other':'अन्य','Dead in shell ':'अंडे में मृत',
'Feed':'दाना','Medicine':'दवा','Vaccine':'टीका','Labour':'मज़दूरी','Electricity':'बिजली','Fuel':'ईंधन','Transport':'ढुलाई','Maintenance':'मरम्मत','Packaging':'पैकिंग','Processing / Slaughter':'प्रोसेसिंग / कटाई','Rent':'किराया',
'Alert limit & timing':'अलर्ट सीमा व समय','Days eggs are stored before loading':'मशीन में डालने से पहले अंडे रखने के दिन','Incubation days':'इन्क्यूबेशन दिन','Market age (days)':'बाज़ार आयु (दिन)','Daily mortality alert (% of live birds)':'दैनिक मृत्यु अलर्ट (% जीवित पक्षी)',
'Supabase connection':'Supabase कनेक्शन','Project URL':'प्रोजेक्ट URL','Anon (public) key':'Anon (public) कुंजी','Save & reload':'सेव करके रीलोड','Use demo mode':'डेमो मोड','Sold':'बिके','Hatch':'हैच',
'Daily entry':'दैनिक एंट्री','Transfer birds (chamber)':'पक्षी ट्रांसफर (चैंबर)','Balance Sheet':'बैलेंस शीट','Chamber No.':'चैंबर नंबर','Mortality (till 8 AM)':'मॉर्टेलिटी (8 बजे सुबह तक)','Cause of mortality':'मॉर्टेलिटी का कारण','Medicine used':'दवा जो चला',
'Temperature morning':'तापमान सुबह','Temperature evening':'तापमान शाम','Temp AM / PM':'तापमान सुबह / शाम','Light total hours':'लाइट कुल घंटे','Feed type':'दाने का प्रकार','Feed bags':'दाना (बोरी)','Feed used (KG)':'दाना चला / KG','Opening stock':'ओपनिंग स्टॉक','Closing stock':'क्लोजिंग स्टॉक','Day old':'डे ओल्ड',
'From flock':'किस झुंड से','To flock':'किस झुंड में','Weight (kg)':'वज़न (किलो)','Price per chick (₹)':'चूजे का भाव (₹)','Print':'प्रिंट','Farm name':'फार्म का नाम','Feed bag size (KG)':'दाना बोरी का वज़न (KG)',
'Pre-Starter feed rate (₹/KG)':'प्री-स्टार्टर दाना दर (₹/KG)','Starter feed rate (₹/KG)':'स्टार्टर दाना दर (₹/KG)','Grower feed rate (₹/KG)':'ग्रोवर दाना दर (₹/KG)','Finisher feed rate (₹/KG)':'फिनिशर दाना दर (₹/KG)','Other feed rate (₹/KG)':'अन्य दाना दर (₹/KG)',
'Pre-Starter':'प्री-स्टार्टर','Starter':'स्टार्टर','Grower':'ग्रोवर','Finisher':'फिनिशर','Other feed':'अन्य दाना','Feed (purchased)':'दाना (खरीदा)','Medicine / Vaccine':'दवा / वैक्सीन','Permanent Labour':'स्थायी मज़दूरी','Daily Labour':'दैनिक मज़दूरी','Slaughtering Labour':'कटाई मज़दूरी',
'Saw Dust':'बुरादा (सॉ डस्ट)','Gas Cylinder':'गैस सिलेंडर','Diesel':'डीज़ल','Ice':'बर्फ','Box':'डिब्बा','Plastic Sheet':'प्लास्टिक शीट','Tape':'टेप','LDPE Bags':'LDPE बैग','Packing – Other':'पैकिंग – अन्य','Transport – Local':'ढुलाई – लोकल','Transport – GKP to NDLS':'ढुलाई – गोरखपुर से दिल्ली','Transport – At NDLS':'ढुलाई – दिल्ली में','Other Expenses':'अन्य खर्च',
'No. of Chicks Received Live':'प्राप्त जीवित चूजे','No. of Chicks by Transfer':'ट्रांसफर से प्राप्त चूजे','Total Mortality':'कुल मॉर्टेलिटी','Price of Live Chicks':'चूजों की कीमत','No. of Birds Sold Live':'जीवित बिके पक्षी','No. of Birds Sold Dressed':'ड्रेस्ड बिके पक्षी','Weight of Birds Sold':'बिके पक्षियों का वज़न','Dressed Weight':'ड्रेस्ड वज़न','Live Weight':'जीवित वज़न',
'Cost of Feed Used':'दाने की लागत','Energy Charge':'ऊर्जा खर्च','Packing Material':'पैकिंग सामग्री','Transportation':'ढुलाई','No. of Birds Remaining / Transferred to another Chamber':'बचे पक्षी / दूसरे चैंबर में ट्रांसफर','Total Cost':'कुल लागत','Total Revenue':'कुल आय','Profit / Loss':'लाभ / हानि','Medicines used (daily sheets)':'प्रयुक्त दवाएं (दैनिक शीट)'};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let LANG=LS('pfm_lang')||'both';
const t=s=>{const h=H[s];return LANG==='en'||!h?s:LANG==='hi'?h:s+' / '+h};

/* ---------- configuration ---------- */
const CFG0={farm:'Siswa Quail Farm',storeDays:5,incDays:18,marketAge:40,mortPct:1,bagKg:50,rate_pre:0,rate_starter:0,rate_grower:0,rate_finisher:0,rate_other:0};
const cfg={...CFG0,...JSON.parse(LS('pfm_cfg')||'{}')};

/* ---------- data layer (Supabase or local demo) ---------- */
const TABLES=['cages','egg_production','hatch_batches','egg_transfers','chick_sales','flocks','weights','daily_logs','flock_transfers','market_sales','mortality','expenses'];
const DB={
  mode:'local',sb:null,
  async init(){
    const url=LS('pfm_sb_url'),key=LS('pfm_sb_key');
    if(url&&key){
      await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load Supabase library (offline?)'));document.head.appendChild(s)});
      this.sb=supabase.createClient(url,key);this.mode='cloud';
    }
  },
  async session(){if(this.mode!=='cloud')return true;const{data}=await this.sb.auth.getSession();return !!data.session},
  async loadAll(){
    if(this.mode==='local'){
      const raw=JSON.parse(LS('pfm_demo_v1')||'{}');TABLES.forEach(k=>D[k]=raw[k]||[]);return;
    }
    for(const k of TABLES){
      let all=[],from=0;
      for(;;){const{data,error}=await this.sb.from(k).select('*').range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
      D[k]=all;
    }
  },
  persist(){LS('pfm_demo_v1',JSON.stringify(D))},
  async insert(k,row){
    if(this.mode==='local'){row={id:uid(),created_at:new Date().toISOString(),...row};D[k].push(row);this.persist();return row}
    const{data,error}=await this.sb.from(k).insert(row).select().single();if(error)throw error;D[k].push(data);return data;
  },
  async update(k,id,row){
    if(this.mode==='local'){const i=D[k].findIndex(r=>r.id===id);D[k][i]={...D[k][i],...row};this.persist();return}
    const{data,error}=await this.sb.from(k).update(row).eq('id',id).select().single();if(error)throw error;const i=D[k].findIndex(r=>r.id===id);D[k][i]=data;
  },
  async remove(k,id){
    if(this.mode==='cloud'){const{error}=await this.sb.from(k).delete().eq('id',id);if(error)throw error}
    D[k]=D[k].filter(r=>r.id!==id);if(this.mode==='local')this.persist();
  }
};

/* ---------- calculations ---------- */
const expOf=(st,id)=>sum(D.expenses.filter(e=>e.stage===st&&e.ref_id===id),e=>e.amount);
const mortOf=(st,id)=>sum(D.mortality.filter(m=>m.stage===st&&m.ref_id===id),m=>m.qty)+(st===3?sum(D.daily_logs.filter(l=>l.flock_id===id),l=>l.mortality):0);
/* mortality = ad-hoc records + mortality typed in the daily sheet (marked _daily) */
const allMort=()=>[...D.mortality,...D.daily_logs.filter(l=>num(l.mortality)>0).map(l=>({id:l.id,_daily:1,stage:3,ref_id:l.flock_id,date:l.date,qty:l.mortality,cause:l.cause,notes:l.medicine?'Medicine: '+l.medicine:''}))];
function liveAt(f,d){ // live birds in a flock at end of date d
  if(d<f.placed_on)return 0;
  return num(f.chicks_placed)+sum(D.flock_transfers.filter(x=>x.to_flock_id===f.id&&x.date<=d),x=>x.qty)-sum(D.flock_transfers.filter(x=>x.from_flock_id===f.id&&x.date<=d),x=>x.qty)
   -sum(D.market_sales.filter(s=>s.flock_id===f.id&&s.date<=d),s=>s.birds)-sum(allMort().filter(m=>m.stage===3&&m.ref_id===f.id&&m.date<=d),m=>m.qty);
}
function cageStats(c){
  const eggs=D.egg_production.filter(e=>e.cage_id===c.id),mort=mortOf(1,c.id),live=c.initial_birds-mort;
  const total=sum(eggs,e=>e.eggs_total),broken=sum(eggs,e=>e.eggs_broken),sent=sum(D.egg_transfers.filter(x=>x.cage_id===c.id),x=>x.eggs);
  const from=addDays(today(),-6),w=sum(eggs.filter(e=>e.date>=from),e=>e.eggs_total);
  return{mort,live,total,broken,sent,stock:total-broken-sent,lay:live>0?w/(live*7)*100:0,exp:expOf(1,c.id)};
}
function batchStats(b){
  const received=sum(D.egg_transfers.filter(x=>x.batch_id===b.id),x=>x.eggs),set=b.eggs_set!=null?num(b.eggs_set):received;
  const hatched=b.hatched_chicks!=null?num(b.hatched_chicks):0,mort=mortOf(2,b.id);
  const sold=sum(D.chick_sales.filter(s=>s.batch_id===b.id),s=>s.qty),placed=sum(D.flocks.filter(f=>f.batch_id===b.id),f=>f.chicks_placed);
  const due=addDays(b.set_date,cfg.incDays),done=b.hatched_chicks!=null,td=today();
  const status=done?'hatched':td<b.set_date?'storage':td>=due?'due':'incubating';
  return{received,set,hatched,mort,sold,placed,avail:hatched-mort-sold-placed,due,done,status,exp:expOf(2,b.id),revenue:sum(D.chick_sales.filter(s=>s.batch_id===b.id),s=>s.amount)};
}
function flockStats(f){
  const mort=mortOf(3,f.id),ms=D.market_sales.filter(s=>s.flock_id===f.id),sold=sum(ms,s=>s.birds);
  const tin=sum(D.flock_transfers.filter(x=>x.to_flock_id===f.id),x=>x.qty),tout=sum(D.flock_transfers.filter(x=>x.from_flock_id===f.id),x=>x.qty);
  const logs=D.daily_logs.filter(l=>l.flock_id===f.id),feedKg=sum(logs,l=>l.feed_kg),feedCost=sum(logs,feedCostLog);
  const w=D.weights.filter(x=>x.flock_id===f.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return{mort,sold,tin,tout,feedKg,feedCost,live:num(f.chicks_placed)+tin-tout-mort-sold,age:diffDays(today(),f.placed_on),weight:w?w.avg_weight_g:null,revenue:sum(ms,s=>s.amount),paid:sum(ms,s=>s.paid),exp3:expOf(3,f.id),exp4:expOf(4,f.id)};
}
const costPerEgg=()=>{const e=sum(D.expenses.filter(x=>x.stage===1),x=>x.amount),n=sum(D.egg_production,x=>x.eggs_total);return n?e/n:0};
function batchCost(b){const s=batchStats(b),total=s.received*costPerEgg()+s.exp;return{total,perChick:s.hatched?total/s.hatched:0}}
function flockCost(f){const b=byId('hatch_batches',f.batch_id),s=flockStats(f),pc=f.chick_price!=null&&f.chick_price!==''?num(f.chick_price):(b?batchCost(b).perChick:0),chick=num(f.chicks_placed)*pc,other=s.exp3+s.exp4+s.feedCost,heads=num(f.chicks_placed)+s.tin;return{chick,other,total:chick+other,perBird:heads?(chick+other)/heads:0}}

  if(f.money)return inr(v);if(f.t==='number')return n2(v);if(f.t==='date')return fdate(v);return esc(v);

function table(cols,rows,empty){
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.c||''}">${t(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.c||''}">${c.f(r)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="muted">${t(empty||'No records')}</td></tr>`}</tbody></table></div>`;

function eggSpark(){
  const days=[...Array(14)].map((_,i)=>addDays(today(),i-13)),vals=days.map(d=>sum(D.egg_production.filter(e=>e.date===d),e=>e.eggs_total)),mx=Math.max(1,...vals);

function pageDash(){

/* Daily sheet — mirrors the paper "Day Old N" slip: opening stock, mortality, cause, medicine, temperature, light, feed, closing stock */
function dailyTable(rows,limit){
  rows=[...rows].sort((a,b)=>b.date.localeCompare(a.date));if(limit)rows=rows.slice(0,limit);
  const fl=r=>byId('flocks',r.flock_id);
  const cols=[{h:'Date',f:r=>fdate(r.date)},{h:'Flock',f:r=>esc(refLabel(3,r.flock_id))},{h:'Day old',c:'r',f:r=>fl(r)?diffDays(r.date,fl(r).placed_on)+1:'–'},
   {h:'Opening stock',c:'r',f:r=>{const f=fl(r);return f?n0(r.date<=f.placed_on?num(f.chicks_placed):liveAt(f,addDays(r.date,-1))):'–'}},
   {h:'Mortality (till 8 AM)',c:'r',f:r=>n0(r.mortality)},{h:'Cause of mortality',f:r=>r.cause?esc(t(r.cause)):'–'},{h:'Medicine used',f:r=>esc(r.medicine||'–')},
   {h:'Temp AM / PM',f:r=>`${r.temp_am??'–'} / ${r.temp_pm??'–'}`},{h:'Light total hours',c:'r',f:r=>r.light_hrs??'–'},
   {h:'Feed type',f:r=>{const m=FEEDT.find(x=>x[0]===r.feed_type);return m?t(m[1]):'–'}},{h:'Feed used (KG)',c:'r',f:r=>r.feed_kg!=null?n2(r.feed_kg):'–'},
   {h:'Closing stock',c:'r',f:r=>{const f=fl(r);return f?`<b>${n0(liveAt(f,r.date))}</b>`:'–'}},{h:'',c:'r',f:r=>btns('daily_logs',r.id)}];
  return table(cols,rows);
}

/* ---------- forms ---------- */
function fieldHTML(f,vals){
  const id='f_'+f.k,v=vals[f.k]??'';let inp;
  if(f.t==='select'){const o=typeof f.opts==='function'?f.opts(vals):f.opts;
    inp=`<select id="${id}" data-k="${f.k}">${f.blank?`<option value="">${t(f.blank)}</option>`:''}${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${f.tr?t(b):esc(b)}</option>`).join('')}</select>`}
  else if(f.t==='textarea')inp=`<textarea id="${id}" data-k="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" data-k="${f.k}" type="${f.t}" ${f.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}">`;
  return `<div class="fld"><label for="${id}">${t(f.l)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function readForm(E){
  const v={};
  E.fields.filter(f=>!f.nf).forEach(f=>{
    const el=$('#f_'+f.k);if(!el)return;let x=el.value;
    if(f.t==='number')x=x===''?null:Number(x);else if(f.num)x=x===''?null:Number(x);else if(x==='')x=null;
    v[f.k]=x;
  });return v;
}
function openForm(name,row,preset){
  const E=ENT[name],vals={};
  E.fields.filter(f=>!f.nf).forEach(f=>vals[f.k]=typeof f.def==='function'?f.def():(f.def??''));
  Object.assign(vals,row||{},preset||{});
  // sensible auto-fill: pick the first available option for required selects with no value
  E.fields.filter(f=>f.t==='select'&&f.req&&(vals[f.k]===''||vals[f.k]==null)).forEach(f=>{const o=typeof f.opts==='function'?f.opts(vals):f.opts;if(o.length)vals[f.k]=o[0][0]});
  S.form={name,row,vals};drawModal();
}
function drawModal(){
  const {name,row,vals}=S.form,E=ENT[name];
  $('#modal').innerHTML=`<div class="dlg"><h3>${row?t('Edit'):t('Add')} · ${t(E.title)}</h3>${E.fields.filter(f=>!f.nf).map(f=>fieldHTML(f,vals)).join('')}<div class="err" id="err"></div><div class="row"><button class="btn" data-a="close">${t('Cancel')}</button><button class="btn pri" data-a="save">${t('Save')}</button></div></div>`;
  $('#modal').classList.add('on');const f=$('#modal input,#modal select');if(f&&!row)f.focus();
}
const closeModal=()=>{$('#modal').classList.remove('on');$('#modal').innerHTML='';S.form=null};
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)};
async function saveForm(){
  const {name,row}=S.form,E=ENT[name],v=readForm(E),err=m=>{$('#err').textContent=m};
  for(const f of E.fields){if(f.req&&!f.nf&&(v[f.k]==null||v[f.k]===''))return err(`${f.l} is required`)}
  if(name==='mortality'&&v.ref_id==null)return err('Choose where the mortality happened');
  if(E.validate){const m=E.validate(v,row);if(m)return err(m)}
  if(E.before)E.before(v,row);
  try{row?await DB.update(name,row.id,v):await DB.insert(name,v)}catch(e){return err(e.message||String(e))}
  closeModal();toast('✓ '+t('Save'));render();
}
async function delRecord(name,id){
  const r=byId(name,id);if(!r)return;
  if(name==='hatch_batches'&&D.flocks.some(f=>f.batch_id===id))return alert('This batch has flocks moved to grow-out. Delete or reassign those flocks first.');
  if(!confirm('Delete this record'+(CASC[name]?' and everything linked to it':'')+'?'))return;
  try{
    for(const [tb,col] of (CASC[name]||[]))for(const x of D[tb].filter(x=>x[col]===id))await DB.remove(tb,x.id);
    for(const st of (POLY[name]||[])){for(const x of D.mortality.filter(x=>x.stage===st&&x.ref_id===id))await DB.remove('mortality',x.id);for(const x of D.expenses.filter(x=>x.stage===st&&x.ref_id===id))await DB.remove('expenses',x.id)}
    await DB.remove(name,id);
  }catch(e){return alert(e.message)}
  if(S.detail&&S.detail.id===id)S.detail=null;render();
}

  if(a==='filter'){S[el.dataset.k]=el.value;render();return}
  if(a==='rf'){S[el.dataset.k]=el.value;render();return}
  if(a==='cfg'){cfg[el.dataset.k]=el.dataset.t?el.value:(Number(el.value)||0);LS('pfm_cfg',JSON.stringify(cfg));toast('✓ '+t('Save'));return}
  if(S.form&&el.closest('#modal')){const E=ENT[S.form.name];
    if(E.fields.some(f=>f.dep===el.dataset.k)){S.form.vals={...S.form.vals,...readForm(E)};
      E.fields.filter(f=>f.dep===el.dataset.k).forEach(f=>{S.form.vals[f.k]=''});
      const f0=E.fields.filter(f=>f.dep===el.dataset.k)[0];const o=f0.opts(S.form.vals);S.form.vals[f0.k]=f0.blank?'':(o[0]?o[0][0]:'');drawModal()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.form)closeModal()});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:type+';charset=utf-8'}));a.download=name;a.click()}
function exportCSV(k){
  const rows=D[k];if(!rows.length)return toast('No records');const keys=Object.keys(rows[0]).filter(x=>x!=='created_at');
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  download(k+'-'+today()+'.csv',[keys.join(','),...rows.map(r=>keys.map(x=>q(r[x])).join(','))].join('\n'),'text/csv');
}

/* ---------- boot ---------- */
function loginView(msg){
  app.innerHTML=`<div class="login card"><h2>🐔 Poultry Farm Manager</h2><p class="sub">पोल्ट्री फार्म मैनेजर</p><div class="fld"><label>${t('Email')}</label><input id="em" type="email"></div><div class="fld"><label>${t('Password')}</label><input id="pw" type="password"></div><div class="err" id="lerr">${esc(msg||'')}</div>
  <div class="row"><button class="btn" id="demo">${t('Use demo mode')}</button><button class="btn pri" id="go">${t('Sign in')}</button></div></div>`;
  $('#go').onclick=async()=>{const{error}=await DB.sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)$('#lerr').textContent=error.message;else boot()};
  $('#demo').onclick=()=>{LS('pfm_sb_url',null);LS('pfm_sb_key',null);location.reload()};
}
async function boot(){
  try{await DB.init();if(!(await DB.session()))return loginView();await DB.loadAll();render()}
  catch(e){app.innerHTML=`<div class="login card"><h2>Connection problem</h2><p class="err">${esc(e.message||e)}</p><button class="btn" onclick="localStorage.removeItem('pfm_sb_url');localStorage.removeItem('pfm_sb_key');location.reload()">Use demo mode</button></div>`}
}
boot();
</script>
